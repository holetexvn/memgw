name: Release

# release-please owns versioning: it reads Conventional Commits on main
# (fix: -> patch, feat: -> minor, feat!: -> major), maintains a running
# "release vX.Y.Z" PR with the generated CHANGELOG section, and when that PR
# is merged it creates the tag and the GitHub release. Only then does the
# publish job run: full test suite, then npm via trusted publishing (OIDC --
# no token, no OTP) with provenance. Ordinary merges never publish.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - name: Install jq (shell test dependency)
        run: sudo apt-get install -y jq
      - name: Full test suite
        run: bash test/run-all.sh
      - name: npm >= 11.5 (OIDC trusted publishing support)
        run: npm install -g npm@latest
      - name: Publish to npm (trusted publishing + provenance)
        run: npm publish --provenance --access public
